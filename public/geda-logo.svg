<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%">
  <defs>
    <style>
      .geda-orange { fill: #F26522; }
      .geda-blue { fill: #38BDF8; stroke: #38BDF8; }
      .geda-green { fill: #4CAF50; }
    </style>
  </defs>

  <!-- Official GEDA Emblem Group (Center X=60, Y=65) -->
  <g transform="translate(60, 65)">
    <!-- 1. Outer Ring of 16 Green Leaves -->
    <!-- Leaves orbiting around circle R=48 -->
    <!-- Leaf 1 -->
    <path d="M 0 -52 C 5 -46 5 -38 0 -34 C -5 -38 -5 -46 0 -52 Z" fill="#4CAF50" transform="rotate(0)" />
    <path d="M 0 -52 C 5 -46 5 -38 0 -34 C -5 -38 -5 -46 0 -52 Z" fill="#4CAF50" transform="rotate(22.5)" />
    <path d="M 0 -52 C 5 -46 5 -38 0 -34 C -5 -38 -5 -46 0 -52 Z" fill="#4CAF50" transform="rotate(45)" />
    <path d="M 0 -52 C 5 -46 5 -38 0 -34 C -5 -38 -5 -46 0 -52 Z" fill="#4CAF50" transform="rotate(67.5)" />
    <path d="M 0 -52 C 5 -46 5 -38 0 -34 C -5 -38 -5 -46 0 -52 Z" fill="#4CAF50" transform="rotate(90)" />
    <path d="M 0 -52 C 5 -46 5 -38 0 -34 C -5 -38 -5 -46 0 -52 Z" fill="#4CAF50" transform="rotate(112.5)" />
    <path d="M 0 -52 C 5 -46 5 -38 0 -34 C -5 -38 -5 -46 0 -52 Z" fill="#4CAF50" transform="rotate(135)" />
    <path d="M 0 -52 C 5 -46 5 -38 0 -34 C -5 -38 -5 -46 0 -52 Z" fill="#4CAF50" transform="rotate(157.5)" />
    <path d="M 0 -52 C 5 -46 5 -38 0 -34 C -5 -38 -5 -46 0 -52 Z" fill="#4CAF50" transform="rotate(180)" />
    <path d="M 0 -52 C 5 -46 5 -38 0 -34 C -5 -38 -5 -46 0 -52 Z" fill="#4CAF50" transform="rotate(202.5)" />
    <path d="M 0 -52 C 5 -46 5 -38 0 -34 C -5 -38 -5 -46 0 -52 Z" fill="#4CAF50" transform="rotate(225)" />
    <path d="M 0 -52 C 5 -46 5 -38 0 -34 C -5 -38 -5 -46 0 -52 Z" fill="#4CAF50" transform="rotate(247.5)" />
    <path d="M 0 -52 C 5 -46 5 -38 0 -34 C -5 -38 -5 -46 0 -52 Z" fill="#4CAF50" transform="rotate(270)" />
    <path d="M 0 -52 C 5 -46 5 -38 0 -34 C -5 -38 -5 -46 0 -52 Z" fill="#4CAF50" transform="rotate(292.5)" />
    <path d="M 0 -52 C 5 -46 5 -38 0 -34 C -5 -38 -5 -46 0 -52 Z" fill="#4CAF50" transform="rotate(315)" />
    <path d="M 0 -52 C 5 -46 5 -38 0 -34 C -5 -38 -5 -46 0 -52 Z" fill="#4CAF50" transform="rotate(337.5)" />

    <!-- 2. Middle Wavy Cyan Water/Energy Ring -->
    <path d="M 0 -37 C 4 -40 8 -34 12 -37 C 16 -40 20 -34 24 -37 C 28 -40 32 -34 36 -37" 
          fill="none" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="37" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6 3" />

    <!-- 3. Inner Orange Sunburst Rays (12 Rays) -->
    <g fill="#F26522">
      <polygon points="0,-30 -4,-20 4,-20" transform="rotate(0)" />
      <polygon points="0,-30 -4,-20 4,-20" transform="rotate(30)" />
      <polygon points="0,-30 -4,-20 4,-20" transform="rotate(60)" />
      <polygon points="0,-30 -4,-20 4,-20" transform="rotate(90)" />
      <polygon points="0,-30 -4,-20 4,-20" transform="rotate(120)" />
      <polygon points="0,-30 -4,-20 4,-20" transform="rotate(150)" />
      <polygon points="0,-30 -4,-20 4,-20" transform="rotate(180)" />
      <polygon points="0,-30 -4,-20 4,-20" transform="rotate(210)" />
      <polygon points="0,-30 -4,-20 4,-20" transform="rotate(240)" />
      <polygon points="0,-30 -4,-20 4,-20" transform="rotate(270)" />
      <polygon points="0,-30 -4,-20 4,-20" transform="rotate(300)" />
      <polygon points="0,-30 -4,-20 4,-20" transform="rotate(330)" />
    </g>

    <!-- 4. Sun Ring & Spiral Core -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#F26522" stroke-width="3.5" />
    <path d="M 0 0 C 4 -6 10 -4 10 2 C 10 8 2 12 -4 8 C -10 4 -8 -6 -2 -10 C 6 -14 14 -8 14 0" 
          fill="none" stroke="#F26522" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Typography Group -->
  <!-- Main Solar IoT Text in Official Orange -->
  <text x="135" y="58" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="1.5" fill="#F26522">
    Solar IoT
  </text>

  <!-- SCADA Badge -->
  <rect x="305" y="28" width="90" height="24" rx="12" fill="#F26522" />
  <text x="350" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    SCADA SaaS
  </text>

  <!-- Full Subtitle: Gujarat Energy Development Agency -->
  <text x="136" y="82" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" letter-spacing="0.4" fill="#38BDF8">
    Gujarat Energy Development Agency
  </text>

  <!-- Tagline -->
  <text x="136" y="102" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.2" fill="rgba(255,255,255,0.7)">
    State Nodal Agency for Renewable Energy • Govt. of Gujarat
  </text>
</svg>
